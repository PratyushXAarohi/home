    <style>
        :root {
            --bg-gradient-from: #4f46e5;
            --bg-gradient-via: #9333ea;
            --bg-gradient-to: #ec4899;
            --card-bg: rgba(255, 255, 255, 0.92);
            --accent-primary: #ec4899;
            --accent-secondary: #6366f1;
            --text-main: #1e1b4b;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, var(--bg-gradient-from), var(--bg-gradient-via), var(--bg-gradient-to));
            background-size: 300% 300%;
            animation: gradientFlow 14s ease infinite;
            min-height: 100vh;
            color: var(--text-main);
            overflow-x: hidden;
        }

        h1, h2, h3, .font-display {
            font-family: 'Fredoka', sans-serif;
        }

        @keyframes gradientFlow {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        @keyframes floatSlow {
            0%, 100% { transform: translateY(0px) rotate(0deg); }
            50% { transform: translateY(-8px) rotate(1.5deg); }
        }

        @keyframes pulseGlow {
            0%, 100% {
                transform: scale(1);
                box-shadow: 0 0 25px rgba(236, 72, 153, 0.75), 0 0 50px rgba(99, 102, 241, 0.55);
            }
            50% {
                transform: scale(1.1);
                box-shadow: 0 0 40px rgba(236, 72, 153, 0.98), 0 0 75px rgba(250, 204, 21, 0.85);
            }
        }

        @keyframes sparkleSpin {
            0% { transform: scale(0.8) rotate(0deg); opacity: 0.7; }
            50% { transform: scale(1.2) rotate(180deg); opacity: 1; }
            100% { transform: scale(0.8) rotate(360deg); opacity: 0.7; }
        }

        .float-card {
            animation: floatSlow 5s ease-in-out infinite;
        }

        .float-card-delayed {
            animation: floatSlow 5s ease-in-out 2.5s infinite;
        }

        .x-badge-glow {
            animation: pulseGlow 2.8s infinite ease-in-out;
        }

        .sparkle-icon {
            animation: sparkleSpin 4s linear infinite;
        }

        @keyframes heartBeatGlow {
            0%, 100% {
                transform: scale(1);
                filter: drop-shadow(0 0 6px rgba(244, 63, 94, 0.8));
            }
            25% {
                transform: scale(1.28);
                filter: drop-shadow(0 0 14px rgba(251, 113, 133, 1));
            }
            50% {
                transform: scale(1.08);
                filter: drop-shadow(0 0 8px rgba(244, 63, 94, 0.9));
            }
            75% {
                transform: scale(1.22);
                filter: drop-shadow(0 0 14px rgba(251, 113, 133, 1));
            }
        }

        .heart-pulse {
            display: inline-block;
            animation: heartBeatGlow 1.4s infinite ease-in-out;
        }

    <!-- Core Global Interactive Functions Defined Early in <head> -->
    <script>
        // Theme presets
        window.DUO_THEMES = {
            cosmic: {
                from: '#4f46e5',
                via: '#9333ea',
                to: '#ec4899'
            },
            sunset: {
                from: '#f97316',
                via: '#ec4899',
                to: '#e11d48'
            },
            ocean: {
                from: '#06b6d4',
                via: '#3b82f6',
                to: '#4f46e5'
            },
            mint: {
                from: '#10b981',
                via: '#14b8a6',
                to: '#0891b2'
            }
        };

        // Web Audio API Sound Effects
        window.audioCtx = null;
        window.getAudioContext = function() {
            if (!window.audioCtx) {
                const AudioContextClass = window.AudioContext || window.webkitAudioContext;
                if (AudioContextClass) {
                    window.audioCtx = new AudioContextClass();
                }
            }
            return window.audioCtx;
        };

        window.playPopSound = function(freq = 500) {
            try {
                const ctx = window.getAudioContext();
                if (!ctx) return;
                const osc = ctx.createOscillator();
                const gain = ctx.createGain();
                osc.type = 'sine';
                osc.frequency.setValueAtTime(freq, ctx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(freq * 1.4, ctx.currentTime + 0.08);

                gain.gain.setValueAtTime(0.08, ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.09);

                osc.connect(gain);
                gain.connect(ctx.destination);
                osc.start();
                osc.stop(ctx.currentTime + 0.09);
            } catch (e) {}
        };

        window.playCelebrationChime = function() {
            const notes = [523.25, 659.25, 783.99, 1046.50];
            notes.forEach((note, idx) => {
                setTimeout(() => window.playPopSound(note), idx * 90);
            });
        };

        // Global Theme Switcher (prevents Uncaught ReferenceError: setTheme is not defined)
        window.setTheme = function(themeName) {
            const selected = window.DUO_THEMES[themeName] || window.DUO_THEMES.cosmic;
            document.documentElement.style.setProperty('--bg-gradient-from', selected.from);
            document.documentElement.style.setProperty('--bg-gradient-via', selected.via);
            document.documentElement.style.setProperty('--bg-gradient-to', selected.to);
            window.playPopSound(600);
        };

        // Global Center Connector Symbol Changer
        window.changeConnector = function(symbol) {
            const centerEl = document.getElementById('centerSymbol');
            const bannerEl = document.getElementById('bannerSymbol');
            if (centerEl) centerEl.textContent = symbol;
            if (bannerEl) bannerEl.textContent = symbol.toLowerCase();
            window.playPopSound(520);
        };
    </script>
</head>
